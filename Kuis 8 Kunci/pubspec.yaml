name: kuis_8_kunci
description: "Kuis 8 Kunci - Multiplayer Quiz App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.5+1
  
  # HTTP Requests
  http: ^1.1.0
  dio: ^5.3.0
  
  # WebSocket
  web_socket_channel: ^2.4.0
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # UI & Animations
  flutter_animate: ^4.5.2
  animated_text_kit: ^4.2.2
  lottie: ^2.4.0
  flutter_svg: ^2.0.0
  audioplayers: ^6.5.1
  google_fonts: ^5.0.0
  
  # Navigation
  go_router: ^11.0.0
  
  # Logging
  logger: ^2.0.1
  
  # Date & Time
  intl: ^0.19.0
  
  # Supabase (client for Flutter)
  supabase_flutter: ^1.4.0
  # Crypto for password hashing
  crypto: ^3.0.2
  confetti: ^0.8.0
  flutter_staggered_animations: ^1.1.1
  simple_animations: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  
  # JSON Serialization Code Generation
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.10.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/icons/logo_apk.jpg
    - assets/karakter/
    - assets/tema/tree/
    # If you add local font files, include them here (example below expects
    # fonts placed into `assets/fonts/`):
    # - assets/fonts/

  # Optional: register NotoSans font family to cover missing characters.
  # Download NotoSans font files and place them under `assets/fonts/`.
  # Example:
  # fonts:
  #   - family: NotoSans
  #     fonts:
  #       - asset: assets/fonts/NotoSans-Regular.ttf
  #       - asset: assets/fonts/NotoSans-Bold.ttf
  #         weight: 700

dependency_overrides:
  sign_in_with_apple: ^6.0.0

# launcher icon generator
flutter_icons:
  android: true
  ios: true
  image_path: assets/icons/logo_apk.jpg
